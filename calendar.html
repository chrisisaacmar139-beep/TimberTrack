<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="calendar.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="icons/calendar-192.png" />
  <link rel="apple-touch-icon" href="icons/calendar-192.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Shop Calendar" />
  <title>Shop Calendar - C.I.M. MFG INC</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="shopcal.js"></script>

  <style>
    :root { --device-font-boost: 1; }
    /* Tablets get bigger text, same as TimberTrack */
    @media (pointer: coarse) and (min-width: 600px) and (min-height: 600px) {
      :root { --device-font-boost: 1.25; }
    }
    html, body {
      font-size: calc(16px * var(--device-font-boost));
      background-color: #f1f5f9;
      color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .break-band { background: repeating-linear-gradient(135deg, #e2e8f0 0 6px, #f1f5f9 6px 12px); }
    .run-block { box-shadow: 0 1px 2px rgba(15,23,42,0.08); }
    .run-overlap { outline: 3px solid #e11d48; outline-offset: -1px; }
    #panel, #settingsPanel, #todoPanel { display: none; position: fixed; inset: 0; z-index: 9990; background: rgba(15,23,42,0.5); }
  </style>
</head>
<body class="min-h-screen">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-amber-50 border border-amber-200 flex items-center justify-center text-lg shrink-0">📅</div>
        <div class="truncate">
          <h1 class="text-sm sm:text-base font-black tracking-tight text-slate-900 leading-none truncate">Shop Calendar</h1>
          <span class="text-[0.5625rem] font-bold text-slate-400 uppercase tracking-widest hidden sm:inline">C.I.M. MFG INC</span>
        </div>
      </div>
      <div class="flex items-center gap-1 sm:gap-1.5 shrink-0">
        <div id="syncDot" class="flex items-center bg-slate-100 border border-slate-300 rounded-lg px-2 py-1 text-[0.6875rem] text-slate-600 font-bold">
          <span class="w-2 h-2 rounded-full bg-amber-400 mr-1 animate-pulse"></span><span>Sync</span>
        </div>
        <a href="index.html" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-300 text-xs font-bold whitespace-nowrap flex items-center gap-1 active:scale-95">🌲<span class="hidden sm:inline">TimberTrack</span></a>
        <button type="button" onclick="openTodo()" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-300 text-xs font-bold whitespace-nowrap flex items-center gap-1 active:scale-95">
          📋<span class="hidden sm:inline">To Schedule</span><span id="todoBadge" class="bg-slate-200 text-slate-800 px-1.5 rounded-md text-[0.625rem] font-black">0</span>
        </button>
        <button type="button" onclick="openSettings()" class="px-2 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg border border-slate-300 text-xs font-bold active:scale-95">⚙️</button>
        <button type="button" onclick="newRun()" class="px-2 sm:px-3 py-1 bg-amber-500 hover:bg-amber-600 text-white font-black rounded-lg text-xs shadow-sm active:scale-95 whitespace-nowrap">+ Run</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-2 sm:px-4 py-3 space-y-3">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm px-3 py-2 flex items-center justify-between gap-2">
      <div class="flex items-center gap-1">
        <button type="button" onclick="shiftWeek(-1)" class="w-9 h-9 rounded-lg bg-slate-100 border border-slate-300 font-black text-slate-700 active:scale-95">‹</button>
        <button type="button" onclick="goToday()" class="px-3 h-9 rounded-lg bg-slate-100 border border-slate-300 text-xs font-bold text-slate-700 active:scale-95">Today</button>
        <button type="button" onclick="shiftWeek(1)" class="w-9 h-9 rounded-lg bg-slate-100 border border-slate-300 font-black text-slate-700 active:scale-95">›</button>
      </div>
      <div class="text-right min-w-0">
        <div id="weekLabel" class="text-sm sm:text-base font-black text-slate-900 truncate"></div>
        <div id="weekSummary" class="text-[0.6875rem] font-semibold text-slate-500 uppercase"></div>
      </div>
    </div>

    <div class="flex items-center gap-3 text-[0.6875rem] font-bold text-slate-600 px-1">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-amber-50 border border-amber-300 border-l-4 border-l-amber-500"></span>Open</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-50 border border-emerald-300 border-l-4 border-l-emerald-500"></span>Completed (time is free)</span>
    </div>

    <div id="warnBar" class="hidden rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs font-bold px-3 py-2"></div>

    <!-- Week grid (tablet / computer) -->
    <div id="weekGrid" class="hidden md:block bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden"></div>
    <!-- Day list (phone) -->
    <div id="dayList" class="md:hidden space-y-2.5"></div>
  </main>

  <!-- RUN DETAILS -->
  <div id="panel" onclick="if(event.target===this) closePanel()">
    <div class="absolute right-0 top-0 bottom-0 w-full sm:max-w-md bg-white shadow-2xl flex flex-col">
      <div id="panelHead" class="px-4 py-3 border-b border-slate-200 flex items-center justify-between gap-2 shrink-0"></div>
      <div id="panelBody" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
      <div class="p-3 border-t border-slate-200 grid grid-cols-2 gap-2 shrink-0">
        <button type="button" onclick="deleteRunClick()" class="py-3 rounded-xl bg-slate-100 border border-slate-300 text-rose-600 font-bold text-sm active:scale-95">🗑️ Delete run</button>
        <button type="button" onclick="savePanel()" class="py-3 rounded-xl bg-sky-600 hover:bg-sky-700 text-white font-black text-sm active:scale-95">Save changes</button>
      </div>
    </div>
  </div>

  <!-- TO SCHEDULE -->
  <div id="todoPanel" onclick="if(event.target===this) closeTodo()">
    <div class="absolute right-0 top-0 bottom-0 w-full sm:max-w-md bg-slate-50 shadow-2xl flex flex-col">
      <div class="px-4 py-3 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
        <div><div class="text-sm font-black uppercase tracking-wider">To Schedule</div><div class="text-[0.6875rem] text-slate-500 font-semibold uppercase">Open POs with moulding not on the calendar</div></div>
        <button type="button" onclick="closeTodo()" class="px-3 h-9 rounded-lg bg-slate-100 border border-slate-300 font-bold text-sm">✕</button>
      </div>
      <div id="todoList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settingsPanel" onclick="if(event.target===this) closeSettings()">
    <div class="absolute right-0 top-0 bottom-0 w-full sm:max-w-md bg-white shadow-2xl flex flex-col">
      <div class="px-4 py-3 border-b border-slate-200 flex items-center justify-between shrink-0">
        <div class="text-sm font-black uppercase tracking-wider">⚙️ Calendar Settings</div>
        <button type="button" onclick="closeSettings()" class="px-3 h-9 rounded-lg bg-slate-100 border border-slate-300 font-bold text-sm">✕</button>
      </div>
      <div id="settingsBody" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>
      <div class="p-3 border-t border-slate-200 shrink-0">
        <button type="button" onclick="saveSettingsClick()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-black text-sm active:scale-95">Save settings</button>
      </div>
    </div>
  </div>

  <script>
    var FIREBASE = {
      apiKey: "AIzaSyDzLA2Ihnw80A6OIMw7Bs9NbKYl3gEF6GU",
      authDomain: "timbertrack-6c42d.firebaseapp.com",
      projectId: "timbertrack-6c42d",
      storageBucket: "timbertrack-6c42d.firebasestorage.app",
      messagingSenderId: "876066859760",
      appId: "1:876066859760:web:839654a3f5e26b9fce3035"
    };
    var S = window.ShopCal;
    var esc = S.esc;
    var db = null;
    var purchaseOrders = [];
    var weekStart = mondayOf(new Date());
    var openRunId = null;
    var PX_PER_MIN = 1.15;

    function mondayOf(d) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); var dow = x.getDay(); x.setDate(x.getDate() - ((dow + 6) % 7)); return x; }
    function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
    function poById(id) { return purchaseOrders.find(function (p) { return p.id === id; }) || null; }
    S.setPoLookup(poById);

    function setSync(ok) {
      var el = document.getElementById('syncDot');
      el.innerHTML = ok ? '<span class="w-2 h-2 rounded-full bg-emerald-500 mr-1"></span><span>Sync</span>' :
        '<span class="w-2 h-2 rounded-full bg-rose-500 mr-1"></span><span>Offline</span>';
    }

    try {
      firebase.initializeApp(FIREBASE);
      db = firebase.firestore();
      S.init(db);
      db.collection('yard_pos').onSnapshot(function (snap) {
        var list = [];
        snap.forEach(function (doc) { list.push(doc.data()); });
        purchaseOrders = list;
        setSync(true);
        render();
      }, function () { setSync(false); });
    } catch (e) { setSync(false); }
    S.onChange(function () { render(); if (document.getElementById('panel').style.display === 'block') renderPanel(); });

    /* ---------- week view ---------- */

    function workDaysOfWeek() {
      var days = [], set = S.getSettings().workDays;
      for (var i = 0; i < 7; i++) { var d = addDays(weekStart, i); if (set.indexOf(d.getDay()) !== -1) days.push(d); }
      return days;
    }

    // Pieces of a run that land on a given day: [{ from, to }] in minutes of day.
    function runPiecesOnDay(r, day) {
      var st = S.runStart(r), en = S.runEnd(r);
      var set = S.getSettings(), ds = S.hm(set.dayStart), de = S.hm(set.dayEnd);
      var key = S.dateKey(day);
      if (S.dateKey(st) > key || S.dateKey(en) < key) return null;
      var from = S.dateKey(st) === key ? st.getHours() * 60 + st.getMinutes() : ds;
      var to = S.dateKey(en) === key ? en.getHours() * 60 + en.getMinutes() : de;
      if (S.runMinutes(r) === 0) to = from + 15;
      if (to <= from) return null;
      return { from: from, to: to, first: S.dateKey(st) === key, last: S.dateKey(en) === key };
    }

    function runFlags(r, overlaps) {
      var late = S.lateEntries([r], poById).length > 0;
      var orphan = (r.entries || []).some(function (e) { return !poById(e.poId); });
      return { overlap: !!overlaps[r.id], late: late, orphan: orphan && purchaseOrders.length > 0 };
    }

    function render() {
      var runs = S.getRuns();
      var days = workDaysOfWeek();
      var set = S.getSettings();
      var overlaps = S.overlapIds(runs);
      var ds = S.hm(set.dayStart), de = S.hm(set.dayEnd);
      var wEnd = addDays(weekStart, 6);
      document.getElementById('weekLabel').innerText = S.fmtDay(weekStart).slice(4) + ' – ' + S.fmtDay(wEnd).slice(4) + ', ' + wEnd.getFullYear();

      // Week summary: booked vs available
      var booked = 0, avail = days.length * S.workMinutesPerDay();
      runs.forEach(function (r) {
        var a = S.runStart(r), b = S.runEnd(r);
        var lo = a < weekStart ? weekStart : a, hi = b > addDays(weekStart, 7) ? addDays(weekStart, 7) : b;
        if (hi > lo) booked += S.workMinutesBetween(lo, hi);
      });
      document.getElementById('weekSummary').innerText = S.fmtDur(booked) + ' booked of ' + S.fmtDur(avail);

      // Warnings
      var warns = [];
      var ovCount = Object.keys(overlaps).length;
      if (ovCount) warns.push('⚠️ ' + ovCount + ' runs overlap (outlined in red).');
      var late = S.lateEntries(runs, poById).filter(function (l) { var po = poById(l.entry.poId); return !po || po.status === 'OPEN'; });
      if (late.length) warns.push('⏰ ' + late.length + ' order(s) finish after their due date: ' + late.slice(0, 3).map(function (l) { return esc(l.entry.customer) + ' (' + esc(l.entry.poId) + ')'; }).join(', ') + (late.length > 3 ? '…' : ''));
      var wb = document.getElementById('warnBar');
      wb.innerHTML = warns.join('<br>');
      wb.classList.toggle('hidden', !warns.length);

      // Grid
      var height = (de - ds) * PX_PER_MIN;
      var todayKey = S.dateKey(new Date());
      var hours = '';
      for (var m = Math.ceil(ds / 60) * 60; m <= de; m += 60) {
        hours += '<div class="absolute left-0 right-0 border-t border-slate-100" style="top:' + ((m - ds) * PX_PER_MIN) + 'px"><span class="absolute -top-2 left-1 text-[0.625rem] font-mono text-slate-400 bg-white px-0.5">' + S.fmtTime(new Date(2000, 0, 1, m / 60, 0)).replace(':00', '') + '</span></div>';
      }
      var breaks = (set.breaks || []).map(function (b) {
        var s = Math.max(S.hm(b.start), ds), e = Math.min(S.hm(b.end), de);
        return e > s ? '<div class="absolute left-0 right-0 break-band" style="top:' + ((s - ds) * PX_PER_MIN) + 'px;height:' + ((e - s) * PX_PER_MIN) + 'px"></div>' : '';
      }).join('');

      var cols = days.map(function (day) {
        var key = S.dateKey(day);
        // Overlapping runs sit side by side in lanes
        var dayRuns = S.sortRuns(runs).map(function (r) { return { r: r, pc: runPiecesOnDay(r, day) }; }).filter(function (x) { return x.pc; });
        var laneEnds = [], cluster = [], clusterEnd = -1;
        var closeCluster = function () { cluster.forEach(function (y) { y.lanes = laneEnds.length; }); cluster = []; laneEnds = []; };
        dayRuns.forEach(function (x) {
          if (x.pc.from >= clusterEnd) { closeCluster(); clusterEnd = -1; }
          var lane = laneEnds.findIndex(function (end) { return end <= x.pc.from; });
          if (lane === -1) { lane = laneEnds.length; laneEnds.push(0); }
          laneEnds[lane] = x.pc.to;
          x.lane = lane;
          cluster.push(x);
          clusterEnd = Math.max(clusterEnd, x.pc.to);
        });
        closeCluster();
        var blocks = dayRuns.map(function (x) {
          var r = x.r, pc = x.pc, lanes = Math.max(1, x.lanes);
          var f = runFlags(r, overlaps), c = S.statusFor(r);
          var top = (pc.from - ds) * PX_PER_MIN, h = Math.max(22, (pc.to - pc.from) * PX_PER_MIN - 2);
          var n = (r.entries || []).length;
          var leftPct = (x.lane / lanes) * 100, widthPct = 100 / lanes;
          return '<button type="button" onclick="openRun(\'' + r.id + '\')" class="run-block absolute rounded-lg border-l-4 border ' + c.block + (f.overlap ? ' run-overlap' : '') + ' text-left px-1.5 py-1 overflow-hidden active:scale-[0.99]" style="top:' + top + 'px;height:' + h + 'px;left:calc(' + leftPct + '% + 3px);width:calc(' + widthPct + '% - 6px)">' +
            '<div class="text-xs font-black leading-tight truncate">' + (S.runDone(r) ? '✓ ' : '') + (f.late ? '⏰ ' : '') + (pc.first ? '' : '↳ ') + esc(r.profile) + '</div>' +
            (h > 34 ? '<div class="text-[0.625rem] font-mono leading-tight">' + S.fmtTime(S.runStart(r)) + '–' + S.fmtTime(S.runEnd(r)) + (pc.last ? '' : ' →') + '</div>' : '') +
            (h > 50 ? '<div class="text-[0.625rem] leading-tight truncate">' + orderCountText(r) + ((r.entries || []).length ? ': ' + (r.entries || []).map(function (e) { return esc(e.customer); }).join(', ') : '') + '</div>' : '') +
          '</button>';
        }).join('');
        return '<div class="flex-1 min-w-0 border-l border-slate-200">' +
          '<div class="h-10 flex flex-col items-center justify-center border-b border-slate-200 ' + (key === todayKey ? 'bg-amber-50' : 'bg-slate-50') + '">' +
            '<div class="text-[0.625rem] font-bold uppercase text-slate-500">' + S.fmtDay(day).slice(0, 3) + '</div>' +
            '<div class="text-sm font-black ' + (key === todayKey ? 'text-amber-700' : 'text-slate-800') + '">' + day.getDate() + '</div></div>' +
          '<div class="relative" style="height:' + height + 'px">' + breaks + blocks + '</div></div>';
      }).join('');

      document.getElementById('weekGrid').innerHTML =
        '<div class="flex"><div class="w-12 shrink-0"><div class="h-10 border-b border-slate-200 bg-slate-50"></div><div class="relative" style="height:' + height + 'px">' + hours + '</div></div>' + cols + '</div>';

      // Phone: day list
      document.getElementById('dayList').innerHTML = days.map(function (day) {
        var key = S.dateKey(day);
        var items = S.sortRuns(runs).filter(function (r) { return runPiecesOnDay(r, day); });
        return '<div class="bg-white rounded-2xl border ' + (key === todayKey ? 'border-amber-400' : 'border-slate-200') + ' shadow-sm overflow-hidden">' +
          '<div class="px-3 py-2 flex items-center justify-between ' + (key === todayKey ? 'bg-amber-50' : 'bg-slate-50') + ' border-b border-slate-200">' +
            '<div class="text-sm font-black ' + (key === todayKey ? 'text-amber-800' : 'text-slate-800') + '">' + S.fmtDay(day) + (key === todayKey ? ' • Today' : '') + '</div>' +
          '</div>' +
          (items.length ? '<div class="p-2 space-y-1.5">' + items.map(function (r) {
            var pc = runPiecesOnDay(r, day), f = runFlags(r, overlaps), c = S.statusFor(r), n = (r.entries || []).length;
            var t = function (m) { return S.fmtTime(new Date(2000, 0, 1, Math.floor(m / 60), m % 60)); };
            return '<button type="button" onclick="openRun(\'' + r.id + '\')" class="w-full text-left rounded-xl border-l-4 border px-3 py-2 ' + c.block + (f.overlap ? ' run-overlap' : '') + ' active:scale-[0.99]">' +
              '<div class="flex items-center justify-between gap-2"><div class="font-black text-sm truncate">' + (S.runDone(r) ? '✓ ' : '') + (f.late ? '⏰ ' : '') + (pc.first ? '' : '↳ ') + esc(r.profile) + '</div>' +
              '<div class="text-xs font-mono font-bold shrink-0">' + t(pc.from) + '–' + t(pc.to) + '</div></div>' +
              '<div class="text-xs truncate">' + orderCountText(r) + (n ? ': ' + (r.entries || []).map(function (e) { return esc(e.customer); }).join(', ') : '') + (pc.last ? '' : ' • continues →') + '</div>' +
            '</button>';
          }).join('') + '</div>' : '<div class="px-3 py-3 text-xs text-slate-400">Nothing booked</div>') +
        '</div>';
      }).join('');

      // To-schedule badge
      document.getElementById('todoBadge').innerText = unscheduledPos().length;
      if (document.getElementById('todoPanel').style.display === 'block') renderTodo();
    }

    function orderCountText(r) {
      var es = r.entries || [], n = es.length, done = es.filter(S.entryDone).length;
      return n + ' order' + (n === 1 ? '' : 's') + (done && done < n ? ' (' + done + ' done)' : '');
    }

    function shiftWeek(n) { weekStart = addDays(weekStart, 7 * n); render(); }
    function goToday() { weekStart = mondayOf(new Date()); render(); }

    /* ---------- run details ---------- */

    function openRun(id) { openRunId = id; renderPanel(); document.getElementById('panel').style.display = 'block'; }
    function closePanel() { document.getElementById('panel').style.display = 'none'; openRunId = null; }

    function renderPanel() {
      var r = S.getRuns().find(function (x) { return x.id === openRunId; });
      if (!r) { closePanel(); return; }
      var c = S.statusFor(r);
      var overlaps = S.overlapIds(S.getRuns());
      document.getElementById('panelHead').innerHTML =
        '<div class="flex items-center gap-2 min-w-0"><span class="w-3 h-8 rounded ' + c.dot + '"></span><div class="min-w-0">' +
        '<div class="text-base font-black truncate">' + esc(r.profile) + ' run</div>' +
        '<div class="text-xs text-slate-500">' + S.fmtWhen(S.runStart(r)) + ' → ' + S.fmtWhen(S.runEnd(r)) + ' • ' + S.fmtDur(S.runMinutes(r)) + '</div></div></div>' +
        '<button type="button" onclick="closePanel()" class="px-3 h-9 rounded-lg bg-slate-100 border border-slate-300 font-bold text-sm shrink-0">✕</button>';

      var entries = (r.entries || []).map(function (e) {
        var po = poById(e.poId);
        var due = S.dueMoment(po ? po.dueDate : e.dueDate);
        var done = S.entryDone(e);
        var late = !done && due && S.runEnd(r) > due;
        return '<div class="rounded-xl border border-l-4 ' + (late ? 'border-rose-300 bg-rose-50 border-l-rose-500' : (done ? 'border-emerald-300 bg-emerald-50 border-l-emerald-500' : 'border-amber-300 bg-white border-l-amber-500')) + ' p-2.5 space-y-1" data-entry="' + e.id + '">' +
          '<div class="flex items-start justify-between gap-2"><div class="min-w-0">' +
            '<div class="font-black truncate">' + esc(e.customer) + ' <span class="font-mono text-xs text-sky-800">' + esc(e.poId) + '</span></div>' +
            (po ? (po.status !== 'OPEN' ? '<div class="text-[0.6875rem] font-bold text-emerald-700">✓ Completed — its time is free for other work</div>' : '<div class="text-[0.6875rem] font-bold text-amber-700">Open</div>') : (purchaseOrders.length ? '<div class="text-[0.6875rem] font-bold text-rose-700">PO no longer in TimberTrack</div>' : '')) +
          '</div>' +
          '<button type="button" onclick="removeEntry(\'' + e.id + '\')" class="shrink-0 text-xs font-bold text-rose-600 px-2 py-1 rounded-lg border border-slate-200 bg-white">Remove</button></div>' +
          (e.lines || []).map(function (l) { return '<div class="text-xs text-slate-600">• ' + esc(l.desc) + (l.mpm ? ' <span class="text-slate-400">@ ' + l.mpm + ' m/min</span>' : '') + '</div>'; }).join('') +
          '<div class="flex items-center justify-between gap-2 text-xs">' +
            '<span class="text-slate-500">' + (e.lf || 0).toLocaleString() + ' LF • ' + (e.bf || 0).toLocaleString() + ' BF' + (due ? ' • <b class="' + (late ? 'text-rose-700' : 'text-amber-800') + '">Due ' + S.fmtDay(due) + (late ? ' (late!)' : '') + '</b>' : '') + '</span>' +
            '<label class="flex items-center gap-1 shrink-0"><input type="number" step="5" min="0" value="' + Math.round(e.minutes) + '" data-min="' + e.id + '" class="w-16 bg-slate-50 border border-slate-300 rounded-lg px-1.5 py-1 text-xs font-mono font-bold text-right" /> min</label>' +
          '</div>' +
          (e.estMinutes && Math.round(e.estMinutes) !== Math.round(e.minutes) ? '<div class="text-[0.625rem] text-slate-400 text-right">App estimate: ' + S.fmtDur(e.estMinutes) + '</div>' : '') +
        '</div>';
      }).join('');

      document.getElementById('panelBody').innerHTML =
        (overlaps[r.id] ? '<div class="rounded-xl bg-rose-50 border border-rose-300 text-rose-800 text-xs font-bold px-3 py-2">⚠️ This run overlaps another run.</div>' : '') +
        '<div class="grid grid-cols-2 gap-2">' +
          '<label class="col-span-2 block text-xs font-bold text-slate-600 uppercase">Start<input id="pStart" type="datetime-local" value="' + esc(r.start) + '" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono font-bold" /></label>' +
          '<label class="block text-xs font-bold text-slate-600 uppercase">Profile<input id="pProfile" type="text" value="' + esc(r.profile) + '" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold" /></label>' +
          '<label class="block text-xs font-bold text-slate-600 uppercase">Changeover (min)<input id="pChange" type="number" step="5" min="0" value="' + (r.changeoverMin || 0) + '" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono font-bold" /></label>' +
        '</div>' +
        '<div class="text-xs font-bold text-slate-600 uppercase pt-1">Orders in this run</div>' +
        (entries || '<div class="text-xs text-slate-400">No orders yet. Saving a PO in TimberTrack, or 📋 To Schedule, can add them here.</div>') +
        '<button type="button" onclick="closePanel(); openTodo();" class="w-full py-2.5 rounded-xl bg-slate-100 border border-slate-300 text-slate-700 font-bold text-xs">📋 Add an order from To Schedule</button>';
    }

    function readPanelInto(run) {
      run.start = document.getElementById('pStart').value || run.start;
      run.profile = document.getElementById('pProfile').value.trim() || run.profile;
      run.changeoverMin = Math.max(0, parseFloat(document.getElementById('pChange').value) || 0);
      (run.entries || []).forEach(function (e) {
        var el = document.querySelector('[data-min="' + e.id + '"]');
        if (el) e.minutes = Math.max(0, parseFloat(el.value) || 0);
      });
    }

    function savePanel() {
      var draft = S.clone(S.getRuns());
      var run = draft.find(function (x) { return x.id === openRunId; });
      if (!run) return;
      readPanelInto(run);
      var st = S.nextWorkMoment(S.parseLocal(run.start));
      var prev = S.blockingRuns(draft).filter(function (x) { return x.id !== run.id && S.runStart(x) <= st && S.blockEnd(x) > st; })[0];
      var go = function () { S.confirmAndSave(draft, run.id, [run.id], null, 'Run saved.').then(function (res) { if (res === 'saved') closePanel(); }); };
      if (prev) {
        S.ask({ title: 'Starts during another run', body: 'That start time is during the <b>' + esc(prev.profile) + '</b> run (' + S.fmtWhen(S.runStart(prev)) + ' to ' + S.fmtWhen(S.blockEnd(prev)) + ').<br>Start this run when that one finishes, at <b>' + S.fmtWhen(S.blockEnd(prev)) + '</b>?',
          buttons: [{ label: 'Yes, start it then', value: 'snap', style: 'primary' }, { label: 'Keep my time (they will overlap)', value: 'keep', style: 'plain' }, { label: 'Cancel', value: 'no', style: 'ghost' }] })
          .then(function (r) {
            if (r.value === 'snap') { run.start = S.toLocalStr(S.nextWorkMoment(S.blockEnd(prev))); go(); }
            else if (r.value === 'keep') go();
          });
      } else go();
    }

    function removeEntry(entryId) {
      var run = S.getRuns().find(function (x) { return x.id === openRunId; });
      var e = run && (run.entries || []).find(function (x) { return x.id === entryId; });
      if (!e) return;
      S.ask({ title: 'Remove from this run?', body: '<b>' + esc(e.customer) + '</b> ' + esc(e.poId) + ' comes off the calendar. It will show in 📋 To Schedule again.',
        buttons: [{ label: 'Remove', value: 'yes', style: 'danger' }, { label: 'Cancel', value: 'no', style: 'ghost' }] })
        .then(function (r) {
          if (r.value !== 'yes') return;
          var copy = S.clone(run);
          copy.entries = copy.entries.filter(function (x) { return x.id !== entryId; });
          S.saveRuns([copy]).then(function () { S.toast('Removed from the run.'); });
        });
    }

    function deleteRunClick() {
      var run = S.getRuns().find(function (x) { return x.id === openRunId; });
      if (!run) return;
      var n = (run.entries || []).length;
      S.ask({ title: 'Delete this run?', body: 'The <b>' + esc(run.profile) + '</b> run on ' + S.fmtWhen(S.runStart(run)) + ' will be removed' + (n ? ', and its ' + n + ' order(s) go back to 📋 To Schedule' : '') + '. Runs after it do not move.',
        buttons: [{ label: 'Delete run', value: 'yes', style: 'danger' }, { label: 'Cancel', value: 'no', style: 'ghost' }] })
        .then(function (r) {
          if (r.value !== 'yes') return;
          S.deleteRun(run.id).then(function () { S.toast('Run deleted.'); });
          closePanel();
        });
    }

    function newRun() {
      var set = S.getSettings();
      var suggest = S.firstOpenSlot(S.getRuns(), set.changeoverMin || 60, new Date());
      S.ask({
        title: 'New profile run',
        body: '<label class="block text-xs font-bold text-slate-600 uppercase">Profile<select name="profile" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold">' +
            S.STANDARD_PROFILES.map(function (p) { return '<option>' + esc(p) + '</option>'; }).join('') + '<option value="__other">Other / custom…</option></select></label>' +
          '<label class="block text-xs font-bold text-slate-600 uppercase">Custom profile name (if Other)<input name="other" type="text" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-bold" /></label>' +
          '<label class="block text-xs font-bold text-slate-600 uppercase">Start<input name="start" type="datetime-local" value="' + S.toLocalStr(suggest) + '" class="w-full mt-1 bg-slate-50 border border-slate-300 rounded-xl px-3 py-2 text-sm font-mono font-bold" /></label>' +
          '<div class="text-xs text-slate-500">Starts with ' + S.fmtDur(set.changeoverMin) + ' of changeover. Orders get added when you save POs.</div>',
        buttons: [{ label: 'Book run', value: 'ok', style: 'amber', validate: function (f) {
          if (!f.querySelector('[name=start]').value) return 'Pick a start.';
          if (f.querySelector('[name=profile]').value === '__other' && !f.querySelector('[name=other]').value.trim()) return 'Type the custom profile name.';
          return null;
        } }, { label: 'Cancel', value: 'no', style: 'ghost' }]
      }).then(function (r) {
        if (r.value !== 'ok') return;
        var profile = r.form.profile === '__other' ? r.form.other.trim() : r.form.profile;
        var draft = S.clone(S.getRuns());
        var run = { id: S.newId('RUN'), profile: profile, start: S.toLocalStr(S.nextWorkMoment(S.parseLocal(r.form.start))), changeoverMin: set.changeoverMin || 0, entries: [], createdAt: Date.now() };
        draft.push(run);
        S.confirmAndSave(draft, run.id, [run.id], null, profile + ' run booked.').then(function (res) {
          if (res === 'saved') { weekStart = mondayOf(S.parseLocal(run.start)); render(); }
        });
      });
    }

    /* ---------- to schedule ---------- */

    function unscheduledPos() {
      return purchaseOrders.filter(function (po) {
        return po.status === 'OPEN' && (po.items || []).some(S.isMouldedLine) && S.entriesForPo(po.id).length === 0;
      }).sort(function (a, b) { return (a.dueDate || '9999') < (b.dueDate || '9999') ? -1 : 1; });
    }
    function openTodo() { renderTodo(); document.getElementById('todoPanel').style.display = 'block'; }
    function closeTodo() { document.getElementById('todoPanel').style.display = 'none'; }
    function renderTodo() {
      var list = unscheduledPos();
      document.getElementById('todoList').innerHTML = list.length ? list.map(function (po) {
        var profiles = [];
        (po.items || []).filter(S.isMouldedLine).forEach(function (l) { var p = S.lineProfile(l); if (profiles.indexOf(p) === -1) profiles.push(p); });
        return '<div class="bg-white rounded-xl border border-amber-300 border-l-4 border-l-amber-500 p-3 space-y-1.5">' +
          '<div class="flex items-start justify-between gap-2"><div class="min-w-0"><div class="font-black truncate">' + esc(po.customer) + '</div><div class="font-mono text-xs font-bold text-sky-800">' + esc(po.id) + '</div></div>' +
          '<div class="text-xs font-bold text-amber-800 font-mono shrink-0">DUE ' + esc(po.dueDate || '—') + '</div></div>' +
          '<div class="text-xs text-slate-600">' + profiles.map(esc).join(', ') + '</div>' +
          '<button type="button" onclick="scheduleFromTodo(\'' + esc(po.id) + '\')" class="w-full py-2 rounded-lg bg-sky-600 hover:bg-sky-700 text-white font-bold text-xs active:scale-95">📅 Put on calendar</button>' +
        '</div>';
      }).join('') : '<div class="p-8 text-center text-sm text-slate-500">Every open PO with moulding is on the calendar.</div>';
    }
    function scheduleFromTodo(id) {
      var po = poById(id);
      if (!po) return;
      closeTodo();
      S.schedulePo(po, { force: true }).then(function () { render(); });
    }

    /* ---------- settings ---------- */

    function openSettings() { renderSettings(); document.getElementById('settingsPanel').style.display = 'block'; }
    function closeSettings() { document.getElementById('settingsPanel').style.display = 'none'; }
    var IN = 'w-full bg-slate-50 border border-slate-300 rounded-lg px-2 py-1.5 text-sm font-mono font-bold';
    function renderSettings() {
      var s = S.getSettings();
      var dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      document.getElementById('settingsBody').innerHTML =
        '<section class="space-y-2"><div class="text-xs font-black text-amber-800 uppercase tracking-wider">Shop hours</div>' +
          '<div class="flex flex-wrap gap-1.5">' + [1, 2, 3, 4, 5, 6, 0].map(function (d) {
            return '<label class="px-2.5 py-1.5 rounded-lg border border-slate-300 text-xs font-bold has-[:checked]:bg-amber-500 has-[:checked]:text-white has-[:checked]:border-amber-500"><input type="checkbox" class="hidden" data-day="' + d + '"' + (s.workDays.indexOf(d) !== -1 ? ' checked' : '') + ' />' + dayNames[d] + '</label>';
          }).join('') + '</div>' +
          '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold text-slate-600 uppercase">Start<input id="sStart" type="time" value="' + s.dayStart + '" class="' + IN + ' mt-1" /></label>' +
          '<label class="text-xs font-bold text-slate-600 uppercase">End<input id="sEnd" type="time" value="' + s.dayEnd + '" class="' + IN + ' mt-1" /></label></div>' +
          '<div class="text-xs font-bold text-slate-600 uppercase">Breaks</div><div id="sBreaks" class="space-y-1.5">' +
          (s.breaks || []).map(breakRow).join('') + '</div>' +
          '<button type="button" onclick="document.getElementById(\'sBreaks\').insertAdjacentHTML(\'beforeend\', breakRow({start:\'\',end:\'\'}))" class="text-xs font-bold text-sky-700">+ Add break</button>' +
          '<div class="text-xs text-slate-500" id="sPerDay">Bookable time per day: ' + S.fmtDur(S.workMinutesPerDay()) + '</div>' +
        '</section>' +

        '<section class="space-y-2 border-t border-slate-200 pt-3"><div class="text-xs font-black text-amber-800 uppercase tracking-wider">Moulder speed (VFD)</div>' +
          '<div class="text-xs text-slate-500">To turn Hz into meters per minute, the app needs one measurement from your machine: run it at a known Hz and measure how many meters it feeds in a minute.</div>' +
          '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold text-slate-600 uppercase">Measured at (Hz)<input id="sCalHz" type="number" step="0.1" value="' + (s.calHz || '') + '" class="' + IN + ' mt-1" oninput="updateMpm()" /></label>' +
          '<label class="text-xs font-bold text-slate-600 uppercase">Gave (m/min)<input id="sCalMpm" type="number" step="0.1" value="' + (s.calMpm || '') + '" class="' + IN + ' mt-1" oninput="updateMpm()" /></label></div>' +
          '<div class="text-xs font-bold text-slate-600 uppercase pt-1">Speed for each width (1x standard profiles)</div>' +
          ['6', '8', '10', '12'].map(function (w) {
            return '<div class="flex items-center gap-2"><span class="w-12 text-sm font-black">1x' + w + '</span>' +
              '<input data-hz="' + w + '" type="number" step="0.1" placeholder="Hz" value="' + (s.speedHz[w] || '') + '" class="' + IN + ' flex-1" oninput="updateMpm()" />' +
              '<span class="w-28 text-xs text-slate-500 font-mono" data-mpm="' + w + '"></span></div>';
          }).join('') +
          '<div class="text-xs text-slate-500">Custom jobs, 2x and other sizes always ask for the speed.</div>' +
        '</section>' +

        '<section class="space-y-2 border-t border-slate-200 pt-3"><div class="text-xs font-black text-amber-800 uppercase tracking-wider">Time rules</div>' +
          '<label class="block text-xs font-bold text-slate-600 uppercase">Changeover between profiles (minutes)<input id="sChange" type="number" step="5" value="' + s.changeoverMin + '" class="' + IN + ' mt-1" /></label>' +
          '<div class="grid grid-cols-2 gap-2"><label class="text-xs font-bold text-slate-600 uppercase">Strapping per lift (min)<input id="sStrap" type="number" step="1" value="' + s.strapMin + '" class="' + IN + ' mt-1" /></label>' +
          '<label class="text-xs font-bold text-slate-600 uppercase">BF per lift<input id="sLift" type="number" step="50" value="' + s.bfPerLift + '" class="' + IN + ' mt-1" /></label></div>' +
          '<div class="text-xs text-slate-500">Every order gets at least 1 lift. Over that, 1 lift per full ' + s.bfPerLift + ' BF (rounded down).</div>' +
        '</section>';
      updateMpm();
    }
    function breakRow(b) {
      return '<div class="flex items-center gap-2" data-break><input type="time" value="' + (b.start || '') + '" class="' + IN + '" data-bs /><span class="text-slate-400">to</span><input type="time" value="' + (b.end || '') + '" class="' + IN + '" data-be />' +
        '<button type="button" onclick="this.parentNode.remove()" class="px-2 text-rose-600 font-bold">✕</button></div>';
    }
    function updateMpm() {
      var ch = parseFloat(document.getElementById('sCalHz').value), cm = parseFloat(document.getElementById('sCalMpm').value);
      document.querySelectorAll('[data-hz]').forEach(function (el) {
        var hz = parseFloat(el.value), out = document.querySelector('[data-mpm="' + el.getAttribute('data-hz') + '"]');
        out.innerText = (hz > 0 && ch > 0 && cm > 0) ? '= ' + (hz * cm / ch).toFixed(1) + ' m/min' : (hz > 0 ? 'needs measurement' : '');
      });
    }
    function saveSettingsClick() {
      var s = S.clone(S.getSettings());
      s.workDays = Array.prototype.slice.call(document.querySelectorAll('[data-day]')).filter(function (el) { return el.checked; }).map(function (el) { return +el.getAttribute('data-day'); });
      s.dayStart = document.getElementById('sStart').value || '08:00';
      s.dayEnd = document.getElementById('sEnd').value || '17:00';
      s.breaks = Array.prototype.slice.call(document.querySelectorAll('[data-break]')).map(function (row) {
        return { start: row.querySelector('[data-bs]').value, end: row.querySelector('[data-be]').value };
      }).filter(function (b) { return b.start && b.end && b.end > b.start; });
      s.calHz = parseFloat(document.getElementById('sCalHz').value) || null;
      s.calMpm = parseFloat(document.getElementById('sCalMpm').value) || null;
      document.querySelectorAll('[data-hz]').forEach(function (el) { s.speedHz[el.getAttribute('data-hz')] = parseFloat(el.value) || null; });
      s.changeoverMin = Math.max(0, parseFloat(document.getElementById('sChange').value) || 0);
      s.strapMin = Math.max(0, parseFloat(document.getElementById('sStrap').value) || 0);
      s.bfPerLift = Math.max(1, parseFloat(document.getElementById('sLift').value) || 1000);
      if (!s.workDays.length) { S.toast('Pick at least one work day.'); return; }
      S.saveSettings(s).then(function () { S.toast('Settings saved.'); closeSettings(); }).catch(function () { S.toast("Couldn't save settings to the cloud."); });
    }

    render();
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
    }
  </script>
</body>
</html>
